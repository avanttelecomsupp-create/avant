    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800;900&display=swap');
        
        * {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Fullscreen Interactive Split Container */
        .configurator-wrap {
            position: relative;
            width: 100vw;
            height: 100vh;
            min-height: 700px;
            overflow: hidden;
            user-select: none;
        }

        .split-side {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Left Side: Soft Off-White Background */
        .side-telecom {
            background: #ededed;
            z-index: 1;
        }

        /* Right Side: Exact Vibrant Coral-Red Gradient Background */
        .side-it {
            background: linear-gradient(135deg, #ff2a54 0%, #ff4b4b 50%, #ff5e3a 100%);
            z-index: 2;
            clip-path: polygon(50% 0, 100% 0, 100% 100%, 50% 100%);
            will-change: clip-path;
        }

        /* Center Slider Divider & Handle */
        .configurator-divider {
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: rgba(255, 255, 255, 0.95);
            z-index: 30;
            transform: translateX(-50%);
            cursor: ew-resize;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.25);
        }

        .slider-handle {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ff3b4e;
            cursor: ew-resize;
            z-index: 31;
            transition: transform 0.15s ease;
        }
        .slider-handle:hover {
            transform: translate(-50%, -50%) scale(1.12);
        }

        /* Exact Center-Aligned Male Subject Placement */
        .subject-container {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 84vh;
            max-height: 740px;
            width: 520px;
            pointer-events: none;
        }

        /* CREAMS Style Big Typography */
        .brand-text-left {
            color: #ff334b;
            font-weight: 300;
            letter-spacing: 0.22em;
        }
        .brand-text-right {
            color: #ffffff;
            font-weight: 800;
            letter-spacing: 0.16em;
        }

        /* Subtitle Text */
        .sub-left {
            color: #71717a;
            letter-spacing: 0.25em;
        }
        .sub-right {
            color: rgba(255, 255, 255, 0.9);
            letter-spacing: 0.25em;
        }

        /* Exact SHOW ME MORE Split Capsule Button */
        .btn-split-capsule {
            display: inline-flex;
            align-items: center;
            height: 48px;
            border-radius: 9999px;
            overflow: hidden;
            box-shadow: 0 8px 25px rgba(255, 65, 84, 0.35);
            background: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .btn-split-capsule:hover {
            transform: scale(1.04);
            box-shadow: 0 12px 32px rgba(255, 65, 84, 0.45);
        }

        .btn-half-telecom {
            background: linear-gradient(90deg, #ff5e3a 0%, #ff3b4e 100%);
            color: #ffffff;
            padding: 0 28px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-half-telecom:hover {
            background: linear-gradient(90deg, #f94c25 0%, #ea263a 100%);
        }

        .btn-half-it {
            background: #ffffff;
            color: #ff3b4e;
            padding: 0 28px;
            height: 100%;
            display: flex;
            align-items: center;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-half-it:hover {
            background: #f8fafc;
        }

        /* Abstract decorative shapes from image */
        .deco-stripes {
            background: repeating-linear-gradient(45deg, rgba(255,255,255,0.4), rgba(255,255,255,0.4) 3px, transparent 3px, transparent 9px);
        }
    </style>
</head>
