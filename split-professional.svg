<svg viewBox="0 0 300 620" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="clipLeft"><rect x="0" y="0" width="150" height="620"/></clipPath>
    <clipPath id="clipRight"><rect x="150" y="0" width="150" height="620"/></clipPath>
  </defs>

  <!-- ===== HEAD ===== -->
  <circle cx="150" cy="92" r="50" fill="#e3ac82"/>
  <!-- ears -->
  <circle cx="101" cy="96" r="8" fill="#e3ac82"/>
  <circle cx="199" cy="96" r="8" fill="#e3ac82"/>

  <!-- Left: hard hat -->
  <g clip-path="url(#clipLeft)">
    <path d="M98,92 C98,50 120,32 150,32 C180,32 202,50 202,92 L202,108 L98,108 Z" fill="#facc15"/>
    <rect x="88" y="100" width="124" height="14" rx="7" fill="#eab308"/>
    <rect x="130" y="60" width="40" height="8" rx="4" fill="#fde68a"/>
  </g>

  <!-- Right: hair -->
  <g clip-path="url(#clipRight)">
    <path d="M100,95 C97,50 120,30 150,30 C182,30 205,52 202,100 C198,72 185,58 150,56 C122,56 108,70 100,95 Z" fill="#1f2937"/>
  </g>

  <!-- neck -->
  <rect x="133" y="128" width="34" height="28" fill="#e3ac82"/>

  <!-- ===== TORSO ===== -->
  <!-- Left: hi-vis vest -->
  <g clip-path="url(#clipLeft)">
    <path d="M68,155 L232,155 L216,332 L84,332 Z" fill="#f97316"/>
    <path d="M95,165 L120,320" stroke="#fde68a" stroke-width="10"/>
    <path d="M150,160 L150,330" stroke="#fde68a" stroke-width="10"/>
    <path d="M68,155 L100,175 L84,332 L60,332 Z" fill="#ea580c"/>
  </g>
  <!-- Right: shirt + tie -->
  <g clip-path="url(#clipRight)">
    <path d="M68,155 L232,155 L216,332 L84,332 Z" fill="#f8fafc"/>
    <path d="M150,155 L232,155 L216,332 L150,332 Z" fill="#f1f5f9"/>
    <path d="M138,158 L162,158 L154,180 L146,180 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <path d="M144,180 L156,180 L163,320 L150,332 L137,320 Z" fill="#1e3a5f"/>
  </g>

  <!-- ===== ARMS ===== -->
  <!-- Left arm: hi-vis sleeve -->
  <path d="M68,160 L34,300 L58,308 L88,175 Z" fill="#f97316"/>
  <rect x="30" y="292" width="30" height="14" rx="6" fill="#fde68a"/>
  <circle cx="42" cy="316" r="17" fill="#e3ac82"/>
  <!-- wrench -->
  <path d="M30,335 L58,307" stroke="#64748b" stroke-width="8" stroke-linecap="round"/>
  <circle cx="28" cy="337" r="8" fill="#94a3b8"/>

  <!-- Right arm: shirt sleeve -->
  <path d="M232,160 L266,300 L242,308 L212,175 Z" fill="#f8fafc"/>
  <rect x="240" y="292" width="30" height="14" rx="6" fill="#e2e8f0"/>
  <circle cx="258" cy="316" r="17" fill="#e3ac82"/>
  <!-- tablet -->
  <rect x="248" y="330" width="34" height="46" rx="4" fill="#1f2937"/>
  <rect x="252" y="335" width="26" height="32" rx="1" fill="#38bdf8"/>

  <!-- ===== BELT ===== -->
  <g clip-path="url(#clipLeft)">
    <rect x="82" y="326" width="136" height="18" fill="#78350f"/>
    <rect x="90" y="330" width="24" height="24" rx="3" fill="#57250a"/>
  </g>
  <g clip-path="url(#clipRight)">
    <rect x="82" y="326" width="136" height="18" fill="#111827"/>
    <rect x="140" y="328" width="20" height="14" rx="2" fill="#374151"/>
  </g>

  <!-- ===== LEGS ===== -->
  <!-- Left leg: cargo pants + boot -->
  <path d="M96,340 L146,340 L142,560 L100,560 Z" fill="#374151"/>
  <rect x="108" y="440" width="24" height="16" rx="3" fill="#1f2937"/>
  <path d="M92,555 L150,555 L156,592 L86,592 Z" fill="#111827"/>

  <!-- Right leg: dress trousers + shoe -->
  <path d="M154,340 L204,340 L200,560 L158,560 Z" fill="#1e293b"/>
  <path d="M150,555 L208,555 L212,585 L146,585 Z" fill="#0f172a"/>
</svg>
